version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: etherpad
build:
  toolchains: []
  run_buildscript: false
images:
  - id: etherpad
    target: service
    service: etherpad
    source: docker.io/etherpad/etherpad
    channel: stable
    sort: semver
    tag_regex: '^3[.][0-9]+[.][0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true
  - id: postgres
    target: service
    service: postgres
    source: docker.io/library/postgres
    channel: stable
    sort: semver
    tag_regex: '^15[.][0-9]+-alpine$'
    version_regex: '^(?P<version>15[.][0-9]+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Etherpad
    skip_if_version_exists: true
